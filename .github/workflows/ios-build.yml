# Builds SENTINEL AI for iPhone on GitHub's Mac runners (no Mac needed).
# Output: an UNSIGNED .ipa artifact. Sign + install it from Windows with
# Sideloadly (free Apple ID, re-sign every 7 days) — see docs/INSTALL.md.
name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx test/protocol.test.ts
        env: { G2_FIXTURES: test/fixtures }
      - run: npx tsx test/wiring.test.ts
      - run: npx tsx test/stress.test.ts
      - run: npx tsx test/core.test.ts
        env: { G2_FIXTURES: test/fixtures }

  live:
    # Alice's real voice brain, end to end: 34 everyday requests must use the right ability (>= 90%).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/live/extract-tools.mjs
      - run: node test/live/live-e2e.mjs app

  ios:
    needs: [test, live]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
        env: { CI: 1 }
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -n1); SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace $WS  scheme $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 80
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry SENTINEL-AI-unsigned.ipa Payload
          ls -lh SENTINEL-AI-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Alice-unsigned-ipa
          path: SENTINEL-AI-unsigned.ipa
          retention-days: 30
      # Also publish it as the "latest" release so it can be downloaded straight from GitHub on any device:
      # https://github.com/robertrichards45/sentinel-ai/releases/latest/download/Alice.ipa
      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          cp SENTINEL-AI-unsigned.ipa Alice.ipa
          cp SENTINEL-AI-unsigned.ipa "Alice-$VER.ipa"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Alice.ipa "Alice-$VER.ipa" --title "Alice $VER" --notes "Install with Sideloadly. Version $VER, built from ${GITHUB_SHA::7}." --latest

  android:
    # The Android version (Galaxy Z Fold and other Android phones). Output: an installable .apk.
    needs: [test, live]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        env: { CI: 1 }
      - name: Build release APK (64-bit phones)
        working-directory: android
        run: |
          printf "\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\n" >> gradle.properties
          if ! ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon > build.log 2>&1; then
            grep -n -B40 -A40 "What went wrong" build.log | head -n 200
            grep -n -i "error" build.log | grep -v "^.*warning" | head -n 60
            exit 1
          fi
          tail -n 15 build.log
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Alice-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  android-publish:
    # Adds the .apk to the same "latest" release as the iPhone build:
    # https://github.com/robertrichards45/sentinel-ai/releases/latest/download/Alice.apk
    needs: [ios, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Alice-apk }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          cp app-release.apk Alice.apk
          cp app-release.apk "Alice-$VER.apk"
          gh release upload latest Alice.apk "Alice-$VER.apk" --clobber
