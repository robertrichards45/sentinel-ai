name: Live voice end-to-end test
on:
  push:
    branches: [live-test]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/live/extract-tools.mjs
      - name: Alice's real brain, as the app uses it (34 requests)
        run: node test/live/live-e2e.mjs app
